        // Keep the HUD offset, scaled to the current zoom
        const k = res / camHome.res;
        cx += (camHome.cx - camHome.dcx) * k; cy += (camHome.cy - camHome.dcy) * k;
        const key = `${cx.toFixed(1)},${cy.toFixed(1)},${res.toFixed(3)}`;
        if (key === camLast) return;                                               // nothing moved
        camLast = key;
        const R = 6378137;
        view.goTo({ center: [(cx / R) * 180 / Math.PI, (2 * Math.atan(Math.exp(cy / R)) - Math.PI / 2) * 180 / Math.PI], scale: res * 96 * 39.37 }, { animate: false })
          .then(updateFurniture).catch(() => {});                                  // scale bar follows the zoom
      }
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // ---- Sonar ripples: when a new day begins, its busiest working areas "ping" ----
      const RIPPLE_MS = 1600;                    // life of one ripple in real time
      let ripples = [], lastDayIdx = -1;
      function spawnRipples(dayIdx, now) {
        const day = data.clusters?.[dayIdx] || [];
        const big = Math.max(...day.map((c) => c.n), 1);
        for (const c of day) {
          // Two rings per area, the second slightly delayed; busier areas ping wider
          for (const delay of [0, 260]) ripples.push({ x: c.x, y: c.y, t0: now + delay, scale: 0.6 + 0.4 * (c.n / big), g: null });
        }
      }
      function updateRipples(now) {
        if (!rippleLayer) return;
        ripples = ripples.filter((r) => {
          const a = (now - r.t0) / RIPPLE_MS;                       // 0 -> 1 over the ripple's life
          if (a >= 1) { if (r.g) rippleLayer.remove(r.g); return false; }
          if (a < 0) return true;                                    // delayed ring, not started yet
          const ease = 1 - Math.pow(1 - a, 3);                       // fast out, slow settle
          const symbol = { type: "simple-marker", style: "circle", size: 6 + ease * 52 * r.scale,
            color: [0, 0, 0, 0], outline: { color: [...RAMP.rest.slice(0, 3), 0.75 * (1 - a)], width: 1.1 } };
          if (!r.g) { r.g = new Graphic({ geometry: { type: "point", x: r.x, y: r.y, spatialReference: { wkid: 102100 } }, symbol }); rippleLayer.add(r.g); }
          else r.g.symbol = symbol;
          return true;
        });
      }
      function clearRipples() { ripples = []; rippleLayer?.removeAll(); }

      function setT(T) {
        // Renderer update only when T actually moved (keeps GPU work minimal)
        if (T !== lastT) { if (mainLayer) mainLayer.renderer = rendererAt(T); lastT = T; }
        curT = T;
        updateCamera(T);
        const dayIdx = Math.min(Math.floor(T), data.nDays - 1);
        // A new day has started -> ping its working areas (only while playing forward)
        if (T < 0) lastDayIdx = -1;
        else if (dayIdx > lastDayIdx) { if (phase === "play" && data.daily[dayIdx]) spawnRipples(dayIdx, performance.now()); lastDayIdx = dayIdx; }
        const shown = Math.max(dayIdx, 0);
        $("date").textContent = dateFmt.format(new Date((data.firstDay + shown) * 864e5));
        $("dayof").textContent = `Day ${shown + 1} of ${data.nDays}`;
        const k = countUpTo(data.tSorted, T);
        $("n-total").textContent = nf.format(k);
        updateGauge(k);
        $("n-day").textContent = nf.format(T < 0 ? 0 : k - countUpTo(data.tSorted, dayIdx - 1e-9));
        drawTimeline(data, Math.max(T, 0));
      }

      async function tick(now) {
        requestAnimationFrame(tick);
        if (!data || paused) return;
        if (now - lastDraw < (LITE ? 60 : 30)) return;   // ~33 fps on desktop, ~16 fps on phones (kinder to memory and battery)
        lastDraw = now;
        const el = (now - phaseStart) / 1000;

        if (reduced) { setT(data.nDays); if (LITE) drawNodesCanvas(curT); return; } // static final state for reduced-motion users
        if (LITE) queueMicrotask(() => drawNodesCanvas(curT));   // after this frame's camera / time update

        updateRipples(now);                                   // advance any ripples on the map
        if (!Number.isNaN(lastT)) drawTimeline(data, Math.max(lastT, 0), now);   // keeps the playhead breathing during holds

        if (phase === "holdStart") {
          // Opening sequence, one step after the other:
          //   1. whole survey in view while the outline traces itself (outlineSeconds)
          //   2. a short beat with the finished outline (0.4 s)
          //   3. the camera moves in to the first day's work area (camMoveSeconds, pan camera only)
          const tracing = CFG.outlineDraw && outline.total ? CFG.outlineSeconds : 0;
          const moveStart = tracing + (outline.total ? CFG.outlinePause : 0);   // hold on the complete outline, zoomed out
          const openLen = panCam() ? moveStart + CFG.camMoveSeconds : Math.max(CFG.holdStart, moveStart);
          if (tracing) { const f = Math.min(el / tracing, 1); drawOutline(1 - Math.pow(1 - f, 3)); }   // eased pen trace
          else drawOutline(1);
          camBlend = panCam() ? smooth((el - moveStart) / CFG.camMoveSeconds) : 0;              // stays zoomed out until the trace is done
          setT(-0.01);
          if (el >= openLen) { phase = "play"; phaseStart = now; drawOutline(1); camBlend = 1; }
        } else if (phase === "play") {
          camBlend = 1;
          const p = Math.min(el / playSeconds(), 1);
          setT(p * data.nDays);
          if (p >= 1) { phase = "holdEnd"; phaseStart = now; }
        } else if (phase === "holdEnd") {
          camBlend = 1 - smooth(el / (CFG.holdEnd * 0.4));                          // pull back to show the whole survey
          updateCamera(data.nDays - 0.001);
          if (el >= CFG.holdEnd) {
            phase = "busy";
            // Refresh between loops when the data is stale - this is what keeps it live
            if (!CFG.demo && Date.now() - lastFetch > CFG.refreshMinutes * 60e3) {
              try { await loadData(); status(`Live · updated ${timeFmt.format(new Date())}`); }
              catch (e) { console.error(e); status("Live · refresh failed, retrying", "error"); lastFetch = Date.now() - (CFG.refreshMinutes - 2) * 60e3; }
            }
            phase = "holdStart"; phaseStart = performance.now(); lastT = NaN; clearRipples();
          }
        }
      }

      // Play / pause button (or Space)
      const togglePause = () => {
        paused = !paused;
        $("tl-play").classList.toggle("paused", paused);
        if (paused) { pauseAt = performance.now(); status("Paused", "paused"); }
        else { phaseStart += performance.now() - pauseAt; status(CFG.demo ? "Demo data" : `Live · updated ${timeFmt.format(new Date(lastFetch))}`); }
      };
      $("tl-play").addEventListener("click", togglePause);

      // Click the track to jump to that day and keep playing from there
      $("timeline").addEventListener("click", (e) => {
        if (!data) return;
        const rect = $("timeline").getBoundingClientRect();
        const f = Math.min(Math.max((e.clientX - rect.left - SCRUB_PAD) / (rect.width - 2 * SCRUB_PAD), 0), 1);
        const now = performance.now();
        phase = "play"; phaseStart = now - f * playSeconds() * 1000;
        clearRipples(); lastDayIdx = Math.floor(f * data.nDays); drawOutline(1);   // jumping mid-trace shows the full outline
        camBlend = 1;
        if (paused) { paused = false; $("tl-play").classList.remove("paused"); status(CFG.demo ? "Demo data" : `Live · updated ${timeFmt.format(new Date(lastFetch))}`); }
        setT(f * data.nDays);
      });
      addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); togglePause(); } });
      // Re-frame and redraw when the dashboard tile is resized
      let resizeTimer;
      addEventListener("resize", () => {
        if (!data) return;
        drawTimeline(data, Math.max(lastT || 0, 0));   // redraw the scrubber at the new width
        if (LITE) drawNodesCanvas(curT);
        clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { fitHud(); fitView(); }, 250);
      });

      // Full reload every few hours so wall screens pick up code changes too
      if (CFG.reloadHours > 0) setTimeout(() => location.reload(), CFG.reloadHours * 36e5);

      if (await loadData()) {
        status(CFG.demo ? "Demo data" : `Live · updated ${timeFmt.format(new Date())}`);
        phase = "holdStart"; phaseStart = performance.now(); camBlend = 0;   // opening starts now, on the whole survey
        requestAnimationFrame(tick);
      }
      window.__anim = { get data() { return data; }, setT, view };   // handy for debugging from the console
    }

    main().catch((err) => {
      console.error(err);
      const msg = String(err?.message || err);
      // Friendlier wording for the most likely failure: a secured layer and no access
      const hint = /token|403|498|499|not authorized|permission/i.test(msg)
        ? " The layer is secured: share it (or a view of it) publicly, or configure an OAuth appId - see README."
        : "";
      overlay(`Could not load the animation: ${msg}.${hint}`);
      status("Error", "error");
    });
  </script>
</body>
</html>
