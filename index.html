<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Deployment Animation</title>

  <!-- Fonts: Barlow for UI text, Barlow Condensed for the big numbers (falls back to system fonts if blocked) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- ArcGIS Maps SDK for JavaScript 5.1 (single module-based CDN entry; defines $arcgis.import) -->
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #070a0f;                 /* page / map background while tiles load */
      --ink: #e8eef5;                /* primary text */
      --ink-dim: #8a97a8;            /* secondary text */
      --ink-faint: #4a5566;          /* tertiary text, rules */
      --accent-hot: #fff3cf;         /* newborn node (white-hot) */
      --accent-warm: #ffb000;        /* node a few hours old (amber) */
      --accent-cool: #beff78;        /* node a day old (pale lime) */
      --accent-yellow: #ffd640;      /* node a few hours old (warm yellow) */
      --accent-rest: #55ff00;        /* settled node (dashboard green #55FF00) */
      --panel: rgba(7, 10, 15, 0.62);/* HUD glass panels */
      --gutter: clamp(12px, 2.2vw, 28px);
      --scrim: 0.55;                 /* darkness of the band behind the left text (0 = off) */
    }

    /* ---------- Page ---------- */
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: var(--bg); color: var(--ink);
      font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;                         /* never scroll inside the dashboard tile */
      -webkit-font-smoothing: antialiased;
    }
    #view { position: absolute; inset: 0; }
    #nodes-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    /* Soft vignette to pull the eye to the centre (Milos/John Nelson style framing) */
    /* Left-side scrim: darkens behind the text and fades to nothing, so the map is dimmed, never hidden */
    #scrim {
      position: absolute; top: 0; bottom: 0; left: 0; width: min(42%, 640px); pointer-events: none;
      background: linear-gradient(90deg, rgba(5, 8, 12, var(--scrim)) 0%, rgba(5, 8, 12, calc(var(--scrim) * 0.75)) 45%, rgba(5, 8, 12, 0) 100%);
    }
    #vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.3) 100%);
    }
    /* Dark, low-key attribution so it is present but quiet */
    #attribution {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2px var(--gutter);
      font-size: 9px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .esri-view-surface--inset-outline:focus::after { outline: none !important; }

    /* ---------- HUD: title + date (top-left) ---------- */
    #hud-title {
      position: absolute; top: var(--gutter); left: var(--gutter);
      pointer-events: none; max-width: 60%;
    }
    #hud-right {
      position: absolute; top: var(--gutter); right: var(--gutter); bottom: calc(var(--gutter) + var(--tl-h) + 24px);
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
    }
    #hud-logo { pointer-events: none; }
    #logo {
      display: block; height: clamp(24px, 4.2vw, 52px); width: auto;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,0.6));      /* keeps it legible over bright imagery */
    }
    .eyebrow {
      font-size: clamp(12px, 1.55vw, 19px); letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink); font-weight: 600;
    }
    .title {
      font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 600;
      font-size: clamp(18px, 2.6vw, 34px); line-height: 1.05; margin-top: 4px;
    }
    #date {
      font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 700;
      font-size: clamp(28px, 5.2vw, 68px); line-height: 1; margin-top: clamp(18px, 3.6vh, 36px);   /* extra space between the title and the date */
      font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
      text-shadow: 0 0 24px rgba(255, 176, 0, 0.18);
    }
    #dayof { font-size: clamp(13px, 1.6vw, 19px); font-weight: 600; letter-spacing: 0.03em; margin-top: 6px; font-variant-numeric: tabular-nums; }
    /* Shared node-ramp gradient text: settled green -> lime -> warm yellow (follows the node colour) */
    .title, #dayof, .stat.small .num {
      color: var(--accent-rest);                                   /* fallback for browsers without background-clip:text */
      background: linear-gradient(90deg, var(--accent-rest) 0%, var(--accent-cool) 55%, var(--accent-yellow) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      width: fit-content;                                          /* gradient spans the text, not the whole panel */
    }

    /* ---------- HUD: counters (top-right) ---------- */
    #hud-stats {
      display: flex; flex-direction: column; align-items: center; width: fit-content;   /* gauge centred under the counters */
      gap: clamp(10px, 2.2vh, 22px);
      margin-top: clamp(20px, 4.5vh, 56px);                /* the gap under "Day N of M" */
      pointer-events: none; text-align: left;
    }
    #stats-row { display: flex; align-items: flex-end; gap: clamp(18px, 3vw, 40px); }
    .stat .num {
      font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 600;
      font-size: clamp(32px, 5.2vw, 72px); line-height: 1; font-variant-numeric: tabular-nums;
    }
    .stat .lbl { font-size: clamp(11px, 1.15vw, 14px); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #f1f5f9; margin-top: 4px;
                 text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.8); }   /* readable over bright imagery */
    .stat.small .num { font-size: clamp(22px, 3.2vw, 42px); }   /* colour: shared gradient below */

    /* ---------- HUD: time scrubber (bottom, Flourish-style) ---------- */
    :root { --tl-h: clamp(90px, 19vh, 170px); }      /* scrubber height, reused by elements stacked above it.
                                                        Tall enough that day-to-day changes in the daily line read clearly on wide screens */
    html.lite { --tl-h: clamp(72px, 14vh, 104px); }  /* phones keep the compact bar */
    #hud-timeline {
      position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(var(--gutter) + 10px);
      height: var(--tl-h); display: flex; align-items: center; gap: clamp(8px, 1.2vw, 16px); pointer-events: auto;
    }
    /* Round play / pause button */
    #tl-play {
      flex: none; width: clamp(28px, 3.4vw, 38px); height: clamp(28px, 3.4vw, 38px); border-radius: 50%;
      border: 1px solid rgba(232,238,245,0.35); background: rgba(7,10,15,0.55); color: var(--ink);
      display: grid; place-items: center; cursor: pointer; padding: 0;
    }
    #tl-play:hover { border-color: var(--accent-rest); color: var(--accent-rest); }
    #tl-play:focus-visible { outline: 2px solid var(--accent-rest); outline-offset: 2px; }
    #tl-play svg { width: 42%; height: 42%; fill: currentColor; }
    #tl-play .ic-play { display: none; }
    #tl-play.paused .ic-play { display: block; }
    #tl-play.paused .ic-pause { display: none; }
    /* Track canvas: click anywhere to jump to that day */
    #timeline { flex: 1 1 0; min-width: 0; width: 0; height: 100%; display: block; cursor: pointer; }   /* width:0 stops the canvas resolution from widening the row */

    /* ---------- Status chip (bottom-right, above timeline) ---------- */
    /* Right-side map furniture block (vertically centred) */
    #hud-map {
      margin: auto 0;                                      /* vertically centred in the column, under the logo */
      display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); pointer-events: none;
    }
    /* Bottom-left group above the scrubber: metadata box | north arrow + scale bar + status */
    #hud-lower {
      position: absolute; left: var(--gutter); bottom: calc(var(--gutter) + var(--tl-h) + 18px);
      display: flex; align-items: flex-end; gap: clamp(18px, 2.5vw, 34px); pointer-events: none;
    }
    /* North arrow + scale bar (+ status), centred on each other */
    #hud-furn { display: flex; flex-direction: column; align-items: center; width: fit-content; gap: 6px; }   /* north arrow centred above the scale bar */
    /* North arrow */
    #north { width: clamp(18px, 2.2vw, 28px); filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7)); }
    #north svg { display: block; width: 100%; height: auto; overflow: visible; }
    #north text { font: 700 10px "Barlow", sans-serif; fill: var(--ink); }
    #north .n-light { fill: var(--ink); }
    #north .n-dark { fill: rgba(232,238,245,0.35); }
    /* Scale bar: alternating two-segment bar + label */
    #scalebar { display: flex; flex-direction: column; align-items: center; gap: 5px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7)); }
    #scalebar .bar { display: flex; height: 8px; border: 1.5px solid rgba(232,238,245,0.85); }
    #scalebar .bar span { flex: 1; }
    #scalebar .bar span + span { border-left: 1.5px solid rgba(232,238,245,0.85); }
    #scalebar .bar span:first-child { background: rgba(232,238,245,0.85); }
    #scalebar .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink); font-variant-numeric: tabular-nums; }
    /* Data source / live status */
    #status {
      margin-top: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
      display: flex; align-items: center; gap: 6px; pointer-events: none;
    }
    #status .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 8px #3ddc97; }
    #status.paused .dot { background: var(--accent-warm); box-shadow: 0 0 8px var(--accent-warm); }
    #status.error .dot { background: #ff5d5d; box-shadow: 0 0 8px #ff5d5d; }

    /* ---------- Overlays: loading / sign-in / message ---------- */
    #overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(7,10,15,0.72); backdrop-filter: blur(2px); z-index: 10; text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }
    #overlay .box { max-width: 420px; }
    #overlay .msg { font-size: 14px; color: var(--ink-dim); line-height: 1.5; margin-top: 10px; }
    #overlay button {
      margin-top: 16px; font: 600 13px "Barlow", sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
      color: #0b0f14; background: var(--accent-warm); border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer;
    }
    #overlay button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 11px 22px; }
    #overlay .btn-sub { font: 500 10px "Barlow", sans-serif; letter-spacing: 0.06em; text-transform: none; opacity: 0.75; }
    #overlay .btn-sub:empty { display: none; }
    #overlay button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto; border-radius: 50%;
      border: 2px solid var(--ink-faint); border-top-color: var(--accent-warm); animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Debug panel (?debug=1) ---------- */
    #debug {
      width: fit-content;
      font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8eef5; text-align: left;
      white-space: nowrap; display: none; z-index: 5;
      grid-template-columns: auto auto auto auto; column-gap: 10px; row-gap: 1px;   /* two key/value columns */
      background: rgba(7, 10, 15, 0.42);                    /* transparent dark glass */
      border: 1px solid rgba(232, 238, 245, 0.16); border-radius: 6px; padding: 8px 12px;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #debug .k { color: rgba(232,238,245,0.6); }
    #debug .v { color: #e8eef5; margin-right: 18px; }
    /* ---------- Progress gauge ---------- */
    .stat.gauge { display: flex; flex-direction: column; align-items: center; }
    .ring-wrap { position: relative; width: min(clamp(100px, 11vw, 160px), 17vh); aspect-ratio: 1; }   /* gauge size (shrinks on short screens) */
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }   /* start at 12 o'clock */
    .g-track { fill: none; stroke: rgba(232,238,245,0.14); stroke-width: 7; }
    .g-ticks { fill: none; stroke: rgba(232,238,245,0.35); stroke-width: 3; stroke-dasharray: 0.6 29.56; }  /* 10 ticks on r=48 */
    .g-arc { fill: none; stroke: url(#g-ring); stroke-width: 7; stroke-linecap: round;
             filter: drop-shadow(0 0 4px var(--accent-rest)); transition: stroke-dasharray 0.25s linear; }
    .g-head { fill: #fffae1; filter: drop-shadow(0 0 4px var(--accent-yellow)); }
    .g-pct {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;   /* number and % on one line */
      font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 600;
      font-size: min(clamp(22px, 2.8vw, 40px), 4.8vh); font-variant-numeric: tabular-nums; color: var(--ink);
    }
    .g-pct small { font-size: 0.6em; margin-left: 1px; color: var(--ink-dim); }
    .stat.gauge .lbl { text-align: center; }

    /* ---------- Small tiles: drop secondary HUD so the map breathes ---------- */
    /* Short screens: when the left column would run into the lower group, the metadata box steps aside
       first ("tight"), then the ring and spacing shrink ("tighter"). Set by fitHud() in the script. */
    html.tight #debug { display: none !important; }
    html.tighter .ring-wrap { width: min(clamp(80px, 8vw, 120px), 12vh); }
    html.tighter #hud-stats { margin-top: clamp(10px, 2.5vh, 30px); gap: 6px; }
    html.tighter #date { margin-top: clamp(8px, 2vh, 24px); }
    @media (max-width: 600px) {
      html.lite #debug { display: none !important; }   /* phones in portrait only: keep the map clear */
      html.lite .ring-wrap { width: min(26vw, 110px); }
    }
    @media (max-height: 560px) {
      #debug { display: none !important; }   /* short tiles: drop the metadata box so nothing overlaps */
    }
    @media (max-height: 340px) {
      #hud-timeline, #status, #scalebar { display: none; }
      #date { margin-top: 4px; }
    }
    @media (max-width: 520px) {
      #hud-title { max-width: 55%; }
    }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="view"></div>
  <canvas id="nodes-canvas"></canvas>   <!-- phone mode: nodes drawn directly here instead of a map layer -->
  <div id="vignette"></div>
  <div id="scrim"></div>   <!-- soft dark band behind the left-hand text -->

  <!-- Title + current date -->
  <div id="hud-title">
    <div class="eyebrow" id="eyebrow">Explor</div>
    <div class="title" id="title">Ibibobo Node Deployment</div>
    <div id="date">&nbsp;</div>
    <div id="dayof">&nbsp;</div>

    <!-- Running counters, side by side under "Day N of M" -->
    <div id="hud-stats">
      <div id="stats-row">
        <div class="stat"><div class="num" id="n-total">0</div><div class="lbl">Nodes deployed</div></div>
        <div class="stat small"><div class="num" id="n-day">0</div><div class="lbl">This day</div></div>
      </div>
      <!-- Progress gauge: share of the planned total deployed so far (centred under the counters) -->
      <div class="stat gauge" id="stat-gauge">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="g-ring" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" style="stop-color: var(--accent-rest)"/>
                <stop offset="0.55" style="stop-color: var(--accent-cool)"/>
                <stop offset="1" style="stop-color: var(--accent-yellow)"/>
              </linearGradient>
            </defs>
            <circle class="g-track" cx="50" cy="50" r="42"/>                       <!-- full ring, faint -->
            <circle class="g-ticks" cx="50" cy="50" r="48"/>                       <!-- 10% tick marks -->
            <circle class="g-arc" id="g-arc" cx="50" cy="50" r="42"/>             <!-- progress arc -->
            <circle class="g-head" id="g-head" cx="50" cy="8" r="3.2"/>          <!-- glowing tip -->
          </svg>
          <div class="g-pct"><span id="g-pct">0</span><small>%</small></div>
        </div>
        <div class="lbl" id="g-lbl">of planned</div>
      </div>
    </div>

  </div>



  <!-- Live status -->

  <!-- Bottom-left group, just above the moving graphs: metadata box, north arrow + scale bar, live status -->
  <div id="hud-lower">
    <!-- Metadata (shown by default; ?debug=0 hides it) -->
    <div id="debug"></div>

    <!-- North arrow centred above the scale bar -->
    <div id="hud-furn">
      <div id="north" title="North">
        <svg viewBox="0 0 24 40" aria-hidden="true">
          <text x="12" y="9" text-anchor="middle">N</text>
          <path d="M12 13 L18 36 L12 31 Z" class="n-dark"/>   <!-- right half, shaded -->
          <path d="M12 13 L6 36 L12 31 Z" class="n-light"/>   <!-- left half, light -->
        </svg>
      </div>
      <div id="scalebar"><div class="bar"><span></span><span></span></div><div class="lbl" id="scale-lbl"></div></div>
      <!-- Live update status, under the scale bar -->
      <div id="status"><span class="dot"></span><span id="status-text">Loading</span></div>
    </div>
  </div>

  <!-- Right-hand column: Explor logo -->
  <div id="hud-right">
  <div id="hud-logo"><img id="logo" alt="Explor" /></div>
  </div>

  <!-- Daily bars + cumulative curve + playhead -->
  <div id="hud-timeline">
    <button id="tl-play" aria-label="Pause / play" title="Pause / play (Space)">
      <svg class="ic-pause" viewBox="0 0 10 10"><rect x="1.5" y="1" width="2.4" height="8"/><rect x="6.1" y="1" width="2.4" height="8"/></svg>
      <svg class="ic-play" viewBox="0 0 10 10"><path d="M2 1 L9 5 L2 9 Z"/></svg>
    </button>
    <canvas id="timeline" title="Click to jump to a day"></canvas>
  </div>

  <div id="attribution">Esri</div>

  <!-- Loading / sign-in / error overlay -->
  <div id="overlay">
    <div class="box">
      <div class="spinner" id="ov-spin"></div>
      <div class="msg" id="ov-msg">Loading deployment data…</div>
      <button id="ov-btn" hidden><span class="btn-main">Show live animation</span><span class="btn-sub">Sign in to ArcGIS Online</span></button>
    </div>
  </div>

  <script type="module">
    // =====================================================================
    // 1. CONFIGURATION
    //    Each project is a preset. Pick one with ?project=<key> (default below).
    //    Any value can also be overridden from the URL, e.g. ?secondsPerDay=0.3
    // =====================================================================
    const PRESETS = {
      // Bolivia 3D - accepted node deployments (hosted layer: Bolivia_3D_Deployed_Nodes_Accepted)
      bolivia3d: {
        layerUrl: "https://services7.arcgis.com/95uulPMgoEYlLkdL/arcgis/rest/services/a30934/FeatureServer/0",
        eyebrow: "Bolivia 3D Seismic Operations",                     // small caps line above the title (logo sits above it)
        title: "Ibibobo Node Deployment",           // main title
        dateField: "utc_time",                      // timestamp used to sequence the animation (true UTC instant)
        dateFallbacks: ["local_time", "UTC_Time", "LocalTime"], // tried in order if dateField is absent
        target: 56588,                              // planned total deployments, drives the progress gauge (0 hides it)
        outlineUrl: "https://services7.arcgis.com/95uulPMgoEYlLkdL/arcgis/rest/services/Ibibobo_3D_Outline/FeatureServer/11",
        where: "index_ = 1",                        // same filter as the dashboard gauge (field index_, alias "index")
        timeZone: "America/La_Paz",                 // utc_time is converted to Bolivia local days (UTC-4)
        basemap: "imagery"                          // imagery (satellite) | hillshade | dark
      }
    };
    const DEFAULT_PROJECT = "bolivia3d";

    // Settings shared by every project (each can be overridden from the URL)
    const DEFAULTS = {
      portalUrl: "https://www.arcgis.com",  // ArcGIS Online (or your Enterprise portal)
      appId: "h273FIA5tWBYfMOR",            // OAuth client ID ("Bolivia 3D Live Animation" credentials item); public by design
      authPopup: "auto",                    // sign-in style: auto = popup on computers and when embedded, redirect on phones opened directly
      secondsPerDay: 1.0,                   // playback speed: seconds of animation per project day
      minDuration: 12,                      // never play faster than this many seconds in total
      maxDuration: 90,                      // never play slower than this many seconds in total
      holdStart: 1.5,                       // seconds to hold before playing when there is no outline / pan camera
      outlineSeconds: 2.5,                  // opening: time for the outline to trace itself, with the whole survey in view
      outlinePause: 1.2,                    // opening: pause on the complete outline, still zoomed out, before moving in
      camMoveSeconds: 1.8,                  // opening: time for the camera to move in to day 1, after the outline is drawn
      holdEnd: 6,                           // seconds to hold the finished map before looping
      refreshMinutes: 20,                   // re-query the layer at loop end if data is older than this
      reloadHours: 12,                      // full page reload (picks up code changes on wall screens)
      nodeSize: 3.2,                        // largest settled node size in px (auto-scaled down for dense views)
      flashSize: 11,                        // largest newborn node size in px
      autoSize: true,                       // scale node sizes to the node density on screen
      ghost: true,                          // faint full footprint underneath ("where this is heading")
      lite: "auto",                         // phone-friendly mode: auto (phones/tablets), 1 (always), 0 (never)
      labels: true,                         // faint reference labels (towns, roads) over the basemap
      interactive: false,                   // allow pan/zoom (off so the dashboard page scrolls normally)
      rotation: 0,                          // map rotation in degrees (e.g. to square up the survey grid)
      padding: 0.03,                        // extra margin around the data extent (fraction)
      panX: 0.06,                           // nudge the survey right (+) or left (-), as a fraction of the free map width
      target: 0,                            // planned total for the progress gauge (set per project; 0 hides it)
      outlineUrl: "",                       // survey outline polygon layer ("" = none)
      outlineFrame: true,                   // frame the map on the whole outline (steady view) instead of the deployed nodes
      outlineDraw: true,                    // trace the outline at the start of each loop
      outlineColor: "",                     // outline colour as hex (empty = purple B040FF)
      where: "",                            // extra filter on the node layer, e.g. "index_ = 1" (set per project)
      scaleKm: 5,                           // scale bar length in km (0 = automatic "nice" length)
      scrim: 0.55,                          // darkness of the soft band behind the left text (0 = off, 0.8 = strong)
      camera: "pan",                        // "pan": one fixed zoom, gliding from each day's work area to the next; "static": whole survey, no motion
      panZoom: 2,                           // how much closer than the whole-survey view the pan camera sits (fixed)
      camSecondsPerDay: 1.4,                // playback speed while the camera pans
      camMaxDuration: 100,                  // longest loop while the camera pans, in seconds
      tzMode: "auto",                       // auto | wallclock | <IANA zone>  (see section 5)
      demo: false,                          // ?demo=1 -> synthetic grid, no sign-in needed
      logo: "explor-logo-white.png",        // logo file next to index.html ("" hides it)
      nodeColor: "",                        // settled node colour as hex (e.g. 7ED957); empty = default light green
      brightness: 0.85,                     // satellite basemap brightness (1 = original, lower = darker)
      debug: true                           // metadata block under the counters (always shown; ?debug=0 hides it)
    };

    // Merge: defaults <- preset <- URL parameters (URL wins)
    const params = new URLSearchParams(location.search);
    const preset = PRESETS[params.get("project") || DEFAULT_PROJECT] || PRESETS[DEFAULT_PROJECT];
    const CFG = { ...DEFAULTS, ...preset };
    for (const [k, v] of params) {
      // Only accept known keys, and cast to the type of the default
      if (!(k in CFG)) continue;
      const t = typeof CFG[k];
      CFG[k] = t === "number" ? Number(v) : t === "boolean" ? /^(1|true|yes)$/i.test(v) : v;
    }

    // Phone-friendly mode. iPhones and iPads give a web page far less GPU memory than a desktop;
    // tens of thousands of glowing points, a second "ghost" copy of them and screen-wide glow
    // effects make Safari kill the tab ("A problem repeatedly occurred"). Lite mode keeps the
    // look but drops the expensive parts: no ghost layer, no glow effects, no label layer,
    // and fewer redraws per second.
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);     // iPadOS reports itself as a Mac
    const LITE = CFG.lite === "auto" ? isMobile : /^(1|true|yes)$/i.test(String(CFG.lite));
    if (LITE) { CFG.ghost = false; CFG.labels = false; document.documentElement.classList.add("lite"); }

    // Colour ramp for a node's "age" (days since it was deployed, relative to the playhead)
    const RAMP = {
      hot:  [255, 250, 225, 1.0],   // 0 h      white-hot flash
      warm: [255, 214,  64, 1.0],   // ~6 h     warm yellow
      cool: [190, 255, 120, 0.95],  // ~1 day   pale lime
      rest: [ 85, 255,   0, 0.85]   // 3+ days  settled #55FF00 (matches the dashboard map)
    };
    // Optional override of the settled colour from the URL, e.g. ?nodeColor=7ED957
    if (/^#?[0-9a-f]{6}$/i.test(CFG.nodeColor || "")) {
      const h = CFG.nodeColor.replace("#", "");
      RAMP.rest = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 0.85];
    }
    // Title, "Day N of M" and other accents take the same colour as the settled nodes
    document.documentElement.style.setProperty("--accent-rest", `rgb(${RAMP.rest[0]}, ${RAMP.rest[1]}, ${RAMP.rest[2]})`);

    // =====================================================================
    // 2. SMALL DOM HELPERS
    // =====================================================================
    const $ = (id) => document.getElementById(id);
    const nf = new Intl.NumberFormat("en-US");
    // Dates are built by hand ("23 Sep 2026") so every browser renders them identically
    const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const pad2 = (n) => String(n).padStart(2, "0");
    const dateFmt = { format: (d) => `${pad2(d.getUTCDate())} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}` };
    const shortFmt = { format: (d) => `${pad2(d.getUTCDate())} ${MON[d.getUTCMonth()]}` };
    const timeFmt = { format: (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}` };

    // Show the overlay with a message; spinner and button are optional
    function overlay(msg, { spin = false, button = null } = {}) {
      $("overlay").classList.remove("hidden");
      $("ov-msg").textContent = msg;
      $("ov-spin").style.display = spin ? "block" : "none";
      const btn = $("ov-btn");
      btn.hidden = !button;
      if (button) {
        btn.querySelector(".btn-main").textContent = button.label;          // big line
        btn.querySelector(".btn-sub").textContent = button.sub || "";        // small line under it
        btn.onclick = button.onClick;
      }
    }
    const hideOverlay = () => $("overlay").classList.add("hidden");

    // Status chip text + colour state
    function status(text, state = "live") {
      $("status-text").textContent = text;
      $("status").className = state === "live" ? "" : state;
    }

    // Keep the left column clear of the bottom-left group on short screens (see html.tight / html.tighter)
    function fitHud() {
      const root = document.documentElement, lower = document.getElementById("hud-lower");
      root.classList.remove("tight", "tighter");
      lower.style.left = "";
      const clash = () => lower.getBoundingClientRect().top
                          < document.getElementById("hud-title").getBoundingClientRect().bottom + 14;
      if (clash()) root.classList.add("tighter");          // 1. smaller ring and spacing
      if (clash()) {                                        // 2. still too tall: slide the lower group to the right of the left column
        const right = Math.max(...["hud-stats", "dayof", "date", "title"].map((id) => document.getElementById(id).getBoundingClientRect().right));
        lower.style.left = `${Math.round(right + 32)}px`;
      }
      if (lower.getBoundingClientRect().right > window.innerWidth - 16) {   // 3. no room beside it either: drop the metadata box
        lower.style.left = ""; root.classList.add("tight");
      }
    }

    // Static text from config
    $("eyebrow").textContent = CFG.eyebrow;
    $("title").textContent = CFG.title;
    document.title = `${CFG.title} · Explor ${CFG.eyebrow.replace(/\s*·\s*/g, " ")}`;

    // Darkness of the band behind the left text
    document.documentElement.style.setProperty("--scrim", String(Math.min(Math.max(Number(CFG.scrim) || 0, 0), 0.9)));

    // Company logo (removed quietly if the file is missing)
    if (CFG.logo) { $("logo").src = CFG.logo; $("logo").onerror = () => $("logo").remove(); }
    else $("logo").remove();

    // =====================================================================
    // 3. LOAD SDK MODULES
    //    $arcgis.import is the 5.x CDN loader. A test harness may pre-inject
    //    modules via window.__ARCGIS_TEST_MODULES (used for offline testing).
    // =====================================================================
    const MODULES = [
      "@arcgis/core/Map.js",
      "@arcgis/core/views/MapView.js",
      "@arcgis/core/layers/FeatureLayer.js",
      "@arcgis/core/layers/TileLayer.js",
      "@arcgis/core/Basemap.js",
      "@arcgis/core/Graphic.js",
      "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/identity/OAuthInfo.js",
      "@arcgis/core/identity/IdentityManager.js"
    ];
    async function loadModules() {
      if (window.__ARCGIS_TEST_MODULES) return MODULES.map((m) => window.__ARCGIS_TEST_MODULES[m]);
      // Wait for the CDN script to define $arcgis (module scripts can finish in any order)
      for (let i = 0; i < 200 && typeof window.$arcgis === "undefined"; i++) await new Promise((r) => setTimeout(r, 50));
      if (typeof window.$arcgis === "undefined") throw new Error("ArcGIS Maps SDK did not load (js.arcgis.com unreachable?)");
      return window.$arcgis.import(MODULES);
    }

    // =====================================================================
    // 4. AUTHENTICATION
    //    - Public layer (or public view): nothing to do.
    //    - Secured layer + appId: OAuth popup, credentials remembered in
    //      localStorage so viewers sign in once per token lifetime.
    //    - Secured layer, no appId: the SDK's built-in sign-in dialog appears.
    // =====================================================================
    const CRED_KEY = "explor_live_anim_credentials";

    async function setupAuth(OAuthInfo, esriId) {
      if (CFG.demo || !CFG.appId) return;

      // Restore credentials saved by an earlier visit (silently ignored if storage is blocked)
      try {
        const saved = localStorage.getItem(CRED_KEY);
        if (saved) esriId.initialize(JSON.parse(saved));
      } catch (e) { /* storage unavailable in this context - fine */ }

      // Register the OAuth app.
      // - Opened directly (phone, browser tab): full-page redirect to the ArcGIS sign-in and back.
      //   Mobile Safari/Chrome often lose the result of a sign-in popup, so redirect is the reliable path.
      // - Embedded in a dashboard (iframe): popup, because ArcGIS Online refuses to load inside an iframe.
      const inFrame = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
      const usePopup = CFG.authPopup === "auto" ? (inFrame || !isMobile) : /^(1|true|yes)$/i.test(String(CFG.authPopup));   // computers: popup, as before
      const info = new OAuthInfo({
        appId: CFG.appId,
        portalUrl: CFG.portalUrl,
        popup: usePopup,
        popupCallbackUrl: new URL("oauth-callback.html", location.href).href,
        flowType: "auto",
        expiration: 20160                  // request a 2-week token (minutes)
      });
      esriId.registerOAuthInfos([info]);

      // Persist any credential the SDK obtains from now on
      esriId.on("credential-create", () => {
        try { localStorage.setItem(CRED_KEY, JSON.stringify(esriId.toJSON())); } catch (e) { /* ignore */ }
      });

      // Already signed in (saved token, or just back from the sign-in redirect)? Then carry on.
      try { await esriId.checkSignInStatus(`${CFG.portalUrl}/sharing`); return; } catch (e) { /* not signed in */ }
      // Back from the redirect but not yet processed? Ask for the credential silently (completes the code exchange).
      if (!usePopup && /[?&#](code|access_token)=/.test(location.href)) {
        try { await esriId.getCredential(`${CFG.portalUrl}/sharing`, { oAuthPopupConfirmation: false }); return; } catch (e) { /* fall through to the button */ }
      }

      // Otherwise ask for one click - popups must be triggered by a user gesture
      await new Promise((resolve) => {
        overlay("Live node deployment for the project team. If you are already signed in to ArcGIS Online, no password is needed.", {
          button: {
            label: "Show live animation",
            sub: "Sign in to ArcGIS Online",
            onClick: async () => {
              try {
                await esriId.getCredential(`${CFG.portalUrl}/sharing`, { oAuthPopupConfirmation: false });
                overlay("Loading deployment data…", { spin: true });
                resolve();
              } catch (err) {
                overlay(`Sign-in was not completed (${err.message || err}). Try again.`, {
                  button: { label: "Show live animation", sub: "Sign in to ArcGIS Online", onClick: $("ov-btn").onclick }
                });
              }
            }
          }
        });
      });
    }

    // =====================================================================
    // 5. DATA: query every deployment, convert timestamps to "project time"
    //    t = days since the first project day (fractional = time of day).
    //    tzMode decides how a stored date becomes a local calendar day:
    //      wallclock -> value already holds local clock time (Explor local_time)
    //      <IANA>    -> value is a UTC instant; convert to that zone
    //      auto      -> the layer's own dateFieldsTimeZone when it declares one,
    //                   else local_time-style fields = wallclock, otherwise CFG.timeZone
    // =====================================================================
    function makeLocalParts(zone) {
      // Wall-clock: read the stored instant with UTC getters (no shifting)
      if (!zone) return (ms) => { const d = new Date(ms); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds()]; };
      // Real time zone: format the instant in that zone and read the parts back
      const f = new Intl.DateTimeFormat("en-US", { timeZone: zone, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" });
      return (ms) => {
        const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = Number(x.value);
        return [p.year, p.month - 1, p.day, p.hour * 3600 + p.minute * 60 + p.second];
      };
    }

    async function fetchFeatures(FeatureLayer) {
      // Load the service layer to read its schema and limits
      const layer = new FeatureLayer({ url: CFG.layerUrl, outFields: [] });
      await layer.load();

      // Resolve the date field: configured name, then fallbacks, then the first date field on the layer
      const names = layer.fields.map((f) => f.name);
      const find = (n) => names.find((x) => x.toLowerCase() === String(n).toLowerCase());
      let dateField = find(CFG.dateField);
      for (const fb of CFG.dateFallbacks || []) if (!dateField) dateField = find(fb);
      if (!dateField) dateField = layer.fields.find((f) => f.type === "date")?.name;
      if (!dateField) throw new Error("No date field found on the layer - set ?dateField=<name>");

      // Decide how to turn the stored value into a local calendar day
      let zone = null;
      if (CFG.tzMode === "wallclock") zone = null;
      else if (CFG.tzMode && CFG.tzMode !== "auto") zone = CFG.tzMode;
      // Service declares its own time reference: the SDK returns true instants, so convert into that zone
      else if (layer.dateFieldsTimeZone && !["UTC", "Etc/UTC", "GMT", "unknown"].includes(layer.dateFieldsTimeZone)) zone = layer.dateFieldsTimeZone;
      else zone = /local/i.test(dateField) ? null : CFG.timeZone;

      // Page through the layer (hosted layers cap each request at maxRecordCount)
      const pageSize = layer.capabilities?.query?.maxRecordCount || 2000;
      // Records to animate: dated ones, plus the project filter (e.g. index_ = 1, matching the dashboard)
      const where = CFG.where ? `${dateField} IS NOT NULL AND (${CFG.where})` : `${dateField} IS NOT NULL`;
      const total = await layer.queryFeatureCount({ where });
      const outFields = [layer.objectIdField, dateField];
      const pages = [];
      for (let start = 0; start < total; start += pageSize) pages.push(start);

      const rows = [];
      let done = 0;
      // Four requests in flight at a time keeps big layers quick without hammering the service
      const worker = async () => {
        while (pages.length) {
          const start = pages.shift();
          const fs = await layer.queryFeatures({
            where, outFields, returnGeometry: true, start, num: pageSize,
            orderByFields: [layer.objectIdField], outSpatialReference: { wkid: 102100 }
          });
          for (const g of fs.features) {
            if (!g.geometry) continue;
            rows.push({ x: g.geometry.x, y: g.geometry.y, ms: g.attributes[dateField] });
          }
          done += fs.features.length;
          overlay(`Loading deployment data… ${nf.format(done)} / ${nf.format(total)}`, { spin: true });
        }
      };
      await Promise.all([worker(), worker(), worker(), worker()]);
      return { rows, meta: { dateField, zone: zone || "wallclock", total, filter: CFG.where || "", source: layer.title || CFG.layerUrl } };
    }

    // Synthetic 3D receiver grid in the Bolivian Chaco for ?demo=1 (no service, no sign-in)
    function demoFeatures() {
      const R = 6378137, toX = (lon) => (lon * Math.PI / 180) * R, toY = (lat) => Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2)) * R;
      const x0 = toX(-63.62), y0 = toY(-21.32);   // south-west corner of the fake survey
      const rows = [];
      const start = Date.UTC(2026, 8, 1);          // 1 Sep 2026, wall-clock
      let rng = 7; const rand = () => ((rng = (rng * 16807) % 2147483647) / 2147483647);
      const lines = 46, pts = 220, lineSp = 400, ptSp = 50, angle = 0.35;
      for (let L = 0; L < lines; L++) {
        // Crews roll the spread line by line; roughly 1.4 lines a day with a few stand-by days
        let day = Math.floor(L / 1.4);
        if (day >= 9) day += 1; if (day >= 21) day += 2;
        for (let P = 0; P < pts; P++) {
          if (rand() < 0.03) continue;             // skips (obstacles, access)
          const u = P * ptSp + (rand() - 0.5) * 6, v = L * lineSp + (rand() - 0.5) * 6;
          const x = x0 + u * Math.cos(angle) - v * Math.sin(angle), y = y0 + u * Math.sin(angle) + v * Math.cos(angle);
          const hour = 7 + (P / pts) * 10 + rand() * 0.6; // crews work 07:00-17:30 along the line
          rows.push({ x, y, ms: start + day * 864e5 + hour * 36e5 });
        }
      }
      // Demo survey outline: a rotated box around the grid, extended north where nothing is deployed yet
      const corner = (u, v) => [x0 + u * Math.cos(angle) - v * Math.sin(angle), y0 + u * Math.sin(angle) + v * Math.cos(angle)];
      const ring = [corner(-150, -150), corner(pts * ptSp + 150, -150), corner(pts * ptSp + 150, 56 * lineSp), corner(-150, 56 * lineSp), corner(-150, -150)];
      return { rows, outline: [ring], meta: { dateField: "demo", zone: "wallclock", total: rows.length, source: "demo grid" } };
    }

    // Turn raw rows into the arrays the animation needs
    function prepare({ rows, meta }) {
      const parts = makeLocalParts(meta.zone === "wallclock" ? null : meta.zone);
      const dayNum = (y, m, d) => Math.round(Date.UTC(y, m, d) / 864e5);
      // Local calendar day + seconds of day for each record
      for (const r of rows) { const [y, m, d, s] = parts(r.ms); r.day = dayNum(y, m, d); r.sec = s; }
      rows.sort((a, b) => a.day - b.day || a.sec - b.sec);

      const firstDay = rows[0].day, lastDay = rows[rows.length - 1].day;
      const nDays = lastDay - firstDay + 1;
      const daily = new Array(nDays).fill(0);
      const tSorted = new Float64Array(rows.length);   // project time of each record, ascending
      rows.forEach((r, i) => {
        r.t = (r.day - firstDay) + r.sec / 86400;      // fractional project day
        tSorted[i] = r.t;
        daily[r.day - firstDay]++;
      });
      return { rows, firstDay, lastDay, nDays, daily, tSorted, meta };
    }

    // Number of records with t <= T (binary search on the sorted array)
    function countUpTo(arr, T) {
      let lo = 0, hi = arr.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] <= T) lo = mid + 1; else hi = mid; }
      return lo;
    }

    // =====================================================================
    // 6. MAP + LAYERS
    // =====================================================================
    function buildBasemap(TileLayer, Basemap) {
      const svc = "https://services.arcgisonline.com/arcgis/rest/services/";
      const base = [];
      if (CFG.basemap === "imagery") {
        // Desaturated, darkened imagery so the nodes carry the colour
        base.push(new TileLayer({ url: svc + "World_Imagery/MapServer", effect: `grayscale(0.2) brightness(${CFG.brightness}) contrast(1.05)` }));
      } else if (CFG.basemap === "dark") {
        base.push(new TileLayer({ url: svc + "Canvas/World_Dark_Gray_Base/MapServer" }));
      } else {
        // Default: dark gray canvas with dark hillshade "screened" on top for subtle terrain
        base.push(new TileLayer({ url: svc + "Canvas/World_Dark_Gray_Base/MapServer" }));
        base.push(new TileLayer({ url: svc + "Elevation/World_Hillshade_Dark/MapServer", opacity: 0.55, blendMode: "screen" }));
      }
      const reference = CFG.labels ? [new TileLayer({ url: svc + "Canvas/World_Dark_Gray_Reference/MapServer", opacity: 0.55 })] : [];
      return new Basemap({ baseLayers: base, referenceLayers: reference });
    }

    // Client-side layer from the prepared rows (only geometry + project time "t")
    function makeLayer(FeatureLayer, Graphic, data, opts) {
      const source = data.rows.map((r, i) => new Graphic({
        geometry: { type: "point", x: r.x, y: r.y, spatialReference: { wkid: 102100 } },
        attributes: { oid: i + 1, t: r.t }
      }));
      return new FeatureLayer({
        source, objectIdField: "oid", geometryType: "point", spatialReference: { wkid: 102100 },
        fields: [{ name: "oid", type: "oid" }, { name: "t", type: "double" }],
        popupEnabled: false, legendEnabled: false, listMode: "hide", ...opts
      });
    }

    // Renderer for playhead time T: colour + size keyed on t, so the GPU does the per-node work.
    // Nodes with t > T sit beyond the last stop -> transparent, size 0 (not yet deployed).
    // Current marker sizes in px (recomputed by fitView when autoSize is on)
    const SIZE = { node: DEFAULTS.nodeSize, flash: DEFAULTS.flashSize };

    function rendererAt(T) {
      const c = (a) => ({ r: a[0], g: a[1], b: a[2], a: a[3] });
      const eps = 1e-4;
      return {
        type: "simple",
        symbol: { type: "simple-marker", style: "circle", size: SIZE.node, color: [255, 255, 255, 1], outline: null },
        visualVariables: [
          { type: "color", field: "t", stops: [
              { value: T - 3.0,  color: c(RAMP.rest) },   // settled
              { value: T - 1.0,  color: c(RAMP.cool) },   // yesterday
              { value: T - 0.25, color: c(RAMP.warm) },   // a few hours ago
              { value: T,        color: c(RAMP.hot) },    // right now
              { value: T + eps,  color: { r: 0, g: 0, b: 0, a: 0 } } // future
          ]},
          { type: "size", field: "t", stops: [
              { value: T - 1.5,  size: SIZE.node },
              { value: T - 0.3,  size: SIZE.node * 1.5 },
              { value: T,        size: SIZE.flash },
              { value: T + eps,  size: 0 }
          ]}
        ]
      };
    }

    // =====================================================================
    // 7. TIME SCRUBBER (Flourish-style): hairline track, a tick per day,
    //    month marks, glowing comet playhead. No chart - the map is the story.
    // =====================================================================
    const SCRUB_PAD = 10;                                   // px kept free at each end for the playhead glow
    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    function drawTimeline(data, T, now = performance.now()) {
      const cv = $("timeline");
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const n = data.nDays, max = Math.max(...data.daily, 1);
      const x = (t) => SCRUB_PAD + (Math.min(Math.max(t, 0), n) / n) * (w - 2 * SCRUB_PAD);   // project day -> px
      const y = Math.round(h - Math.max(34, h * 0.38)) + 0.5;                                   // track line (day numbers + months below it)
      const headX = x(T);

      // Hairline track
      ctx.fillStyle = "rgba(232,238,245,0.16)"; ctx.fillRect(x(0), y - 0.5, x(n) - x(0), 1);

      // One small tick per day: brighter on busy days once the playhead has passed (a whisper of activity)
      for (let i = 0; i <= n; i++) {
        const passed = i <= T;
        const a = passed ? 0.25 + 0.6 * ((data.daily[Math.min(i, n - 1)] || 0) / max) : 0.14;
        ctx.fillStyle = passed ? rgba(RAMP.rest, a) : `rgba(232,238,245,${a})`;
        ctx.fillRect(Math.round(x(i)) - 0.5, y + 3, 1, 4);
      }

      // Day numbers under the track, centred on each day. Thinned out (every 2nd, 5th...) when days get narrow.
      const dayPx = (w - 2 * SCRUB_PAD) / n;
      const fs = Math.max(9, Math.min(11, h * 0.14));
      const step = [1, 2, 5, 7, 10, 15].find((k) => k * dayPx >= fs * 1.9) || 30;
      const curDay = Math.min(Math.floor(T), n - 1);
      ctx.textBaseline = "top"; ctx.textAlign = "center";
      let lastLabelX = -Infinity;                                    // avoids two numbers touching
      for (let i = 0; i < n; i++) {
        const dom = new Date((data.firstDay + i) * 864e5).getUTCDate();
        const isCur = i === curDay && T >= 0;
        if (!isCur && (dom % step !== 0 && dom !== 1) ) continue;   // keep 1st of month and every step-th day
        if (!isCur && Math.abs(i - curDay) * dayPx < fs * 1.6 && T >= 0) continue; // make room around the current day
        if (!isCur && x(i + 0.5) - lastLabelX < fs * 1.7) continue;                // too close to the previous number
        lastLabelX = x(i + 0.5);
        ctx.font = `${isCur ? 700 : 500} ${isCur ? fs + 1 : fs}px Barlow, system-ui, sans-serif`;
        ctx.fillStyle = isCur ? rgba(RAMP.hot, 1) : (i < T ? "rgba(232,238,245,0.6)" : "rgba(232,238,245,0.3)");
        ctx.fillText(String(dom), x(i + 0.5), y + 9);
      }
      ctx.textAlign = "left";

      // Month marks: taller tick + label under the day numbers (project start and every 1st of the month)
      ctx.font = `600 ${Math.max(9, Math.min(11, h * 0.14))}px Barlow, system-ui, sans-serif`;
      ctx.textBaseline = "top";
      for (let i = 0; i <= n; i++) {
        const d = new Date((data.firstDay + i) * 864e5);
        if (i !== 0 && d.getUTCDate() !== 1) continue;
        const px = Math.round(x(i)) - 0.5;
        ctx.fillStyle = "rgba(232,238,245,0.45)"; ctx.fillRect(px, y - 5, 1, fs * 2 + 18);
        const label = MON[d.getUTCMonth()].toUpperCase() + (i === 0 || d.getUTCMonth() === 0 ? ` ${d.getUTCFullYear()}` : "");
        ctx.fillStyle = rgba(RAMP.rest, 0.75); ctx.fillText(label, px + 3, y + 9 + fs + 5);
      }

      // Daily line: nodes per day, drawn up to the playhead so it "writes itself" as time moves
      const top = 4, base = y - 7;                                   // vertical band for the line
      const vy = (v) => base - (v / max) * (base - top);             // count -> px
      const pts = data.daily.map((v, i) => [x(i + 0.5), vy(v)]);     // one point per day, at mid-day
      // Value at the playhead, eased between neighbouring days so the rider glides
      const tc = Math.min(Math.max(T - 0.5, 0), n - 1), i0 = Math.floor(tc), f = tc - i0;
      const vHead = data.daily[i0] + (data.daily[Math.min(i0 + 1, n - 1)] - data.daily[i0]) * (f * f * (3 - 2 * f));
      const riderY = vy(vHead);
      // Visible points: everything left of the playhead, then the rider itself
      const vis = pts.filter((p) => p[0] < headX);
      vis.push([headX, riderY]);
      if (T > 0 && vis.length > 1) {
        // Smooth path through the points (midpoint quadratic curves)
        const path = new Path2D();
        path.moveTo(vis[0][0], vis[0][1]);
        for (let k = 1; k < vis.length - 1; k++) {
          const mx = (vis[k][0] + vis[k + 1][0]) / 2, my = (vis[k][1] + vis[k + 1][1]) / 2;
          path.quadraticCurveTo(vis[k][0], vis[k][1], mx, my);
        }
        path.lineTo(vis[vis.length - 1][0], vis[vis.length - 1][1]);
        // Soft area under the line, fading to nothing at the track
        const area = new Path2D(path);
        area.lineTo(headX, base); area.lineTo(vis[0][0], base); area.closePath();
        const fill = ctx.createLinearGradient(0, top, 0, base);
        fill.addColorStop(0, rgba(RAMP.warm, 0.20)); fill.addColorStop(1, rgba(RAMP.warm, 0));
        ctx.fillStyle = fill; ctx.fill(area);
        // The line itself, glowing
        ctx.save();
        // Vertical gradient: low values green, high values yellow, peaks almost white
        const stroke = ctx.createLinearGradient(0, base, 0, top);
        stroke.addColorStop(0, rgba(RAMP.rest, 1)); stroke.addColorStop(0.6, rgba(RAMP.warm, 1)); stroke.addColorStop(1, rgba(RAMP.hot, 1));
        ctx.shadowColor = rgba(RAMP.warm, 0.7); ctx.shadowBlur = 6;
        ctx.strokeStyle = stroke; ctx.lineWidth = 1.8; ctx.lineJoin = "round";
        ctx.stroke(path);
        ctx.restore();
        // Rider: a small white-hot dot riding the line (the exact count is in "This day", top right)
        ctx.save();
        ctx.shadowColor = rgba(RAMP.warm, 1); ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(headX, riderY, 3, 0, Math.PI * 2); ctx.fillStyle = rgba(RAMP.hot, 1); ctx.fill();
        ctx.restore();
        // Thin stem linking the rider to the playhead on the track
        ctx.fillStyle = "rgba(232,238,245,0.25)"; ctx.fillRect(Math.round(headX) - 0.5, riderY + 4, 1, Math.max(base - riderY - 4, 0));
      }
      // Faint dotted guide for days still to come
      ctx.save();
      ctx.setLineDash([2, 4]); ctx.strokeStyle = "rgba(232,238,245,0.12)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(headX, base); ctx.lineTo(x(n), base); ctx.stroke();
      ctx.restore();
      ctx.textBaseline = "top";

      // Elapsed track in soft white (the daily line above it carries the colour)
      ctx.save();
      ctx.shadowColor = "rgba(232,238,245,0.6)"; ctx.shadowBlur = 6;
      ctx.fillStyle = "rgba(232,238,245,0.85)"; ctx.fillRect(x(0), y - 1, headX - x(0), 2);
      ctx.restore();

      // Comet tail: last stretch fades from green into the white-hot head
      const tail = Math.min(70, headX - x(0));
      if (tail > 1) {
        const g = ctx.createLinearGradient(headX - tail, 0, headX, 0);
        g.addColorStop(0, rgba(RAMP.warm, 0)); g.addColorStop(1, rgba(RAMP.hot, 0.95));
        ctx.fillStyle = g; ctx.fillRect(headX - tail, y - 1.5, tail, 3);
      }

      // Playhead: breathing halo ring + white-hot core
      const pulse = 0.5 + 0.5 * Math.sin(now / 320);
      ctx.beginPath(); ctx.arc(headX, y, 7 + 3 * pulse, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(RAMP.rest, 0.25 + 0.35 * (1 - pulse)); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.save();
      ctx.shadowColor = rgba(RAMP.warm, 1); ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(headX, y, 4.2, 0, Math.PI * 2); ctx.fillStyle = rgba(RAMP.hot, 1); ctx.fill();
      ctx.restore();
    }

    // Each day's work area: centre and a robust size (mean +/- 2.2 standard deviations, at least 800 m)
    function dayBoxes(rows, firstDay, nDays) {
      const acc = Array.from({ length: nDays }, () => ({ n: 0, sx: 0, sy: 0, sxx: 0, syy: 0 }));
      for (const r of rows) {
        const a = acc[r.day - firstDay];
        a.n++; a.sx += r.x; a.sy += r.y; a.sxx += r.x * r.x; a.syy += r.y * r.y;
      }
      return acc.map((a) => {
        if (!a.n) return null;                                    // no deployments that day: camera stays out
        const cx = a.sx / a.n, cy = a.sy / a.n;
        const sdx = Math.sqrt(Math.max(a.sxx / a.n - cx * cx, 0)), sdy = Math.sqrt(Math.max(a.syy / a.n - cy * cy, 0));
        return { cx, cy, w: Math.max(4.4 * sdx, 800) * 1.15, h: Math.max(4.4 * sdy, 800) * 1.15 };
      });
    }
    const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Busiest working areas of each day (2.5 km bins, up to 3) - where the map "pings" when a day starts
    function dayClusters(rows, firstDay, nDays) {
      const CELL = 2500, out = Array.from({ length: nDays }, () => new Map());
      for (const r of rows) {
        const key = `${Math.floor(r.x / CELL)}_${Math.floor(r.y / CELL)}`;
        const m = out[r.day - firstDay];
        const c = m.get(key) || { sx: 0, sy: 0, n: 0 };
        c.sx += r.x; c.sy += r.y; c.n++; m.set(key, c);
      }
      return out.map((m) => {
        const cells = [...m.values()].sort((a, b) => b.n - a.n);
        const top = cells.length ? cells[0].n : 0;
        return cells.filter((c) => c.n >= top * 0.25).slice(0, 3).map((c) => ({ x: c.sx / c.n, y: c.sy / c.n, n: c.n }));
      });
    }

    // =====================================================================
    // 8. MAIN
    // =====================================================================
    async function main() {
      overlay("Loading map…", { spin: true });
      const [Map, MapView, FeatureLayer, TileLayer, Basemap, Graphic, GraphicsLayer, OAuthInfo, esriId] = await loadModules();

      // Map with a dark background so nothing flashes white while tiles load
      const map = new Map({ basemap: buildBasemap(TileLayer, Basemap) });
      const view = new MapView({
        container: "view", map,
        background: { color: [7, 10, 15, 1] },
        spatialReference: { wkid: 102100 },      // Web Mercator, so the nodes, outline and scale bar always agree
        rotation: CFG.rotation,
        constraints: { snapToZoom: false, rotationEnabled: false },
        ui: { components: [] }   // no SDK widgets (deprecated in 5.x); attribution is drawn by us below
      });

      // Basemap attribution, read from each tile service's own copyright text (Esri terms of use)
      map.basemap.load().then(async () => {
        const layers = [...map.basemap.baseLayers, ...map.basemap.referenceLayers];
        await Promise.allSettled(layers.map((l) => l.load()));
        const credits = [...new Set(layers.map((l) => l.copyright).filter(Boolean))];
        $("attribution").textContent = ["Esri", ...credits].join(" | ");
      }).catch(() => { $("attribution").textContent = "Basemap: Esri"; });
      // Freeze navigation unless asked for, so wheel/touch scroll the dashboard instead
      if (!CFG.interactive) {
        // Turn off drag/wheel/touch navigation...
        view.navigation = { browserTouchPanEnabled: false, momentumEnabled: false, actionMap: { dragPrimary: "none", dragSecondary: "none", mouseWheel: "none" } };
        // ...and swallow the remaining gestures (double-click zoom, keyboard, pinch)
        for (const ev of ["double-click", "double-tap-drag", "key-down", "drag", "mouse-wheel"]) {
          try { view.on(ev, (e) => e.stopPropagation()); } catch (e) { /* event not supported in this SDK version */ }
        }
      }

      await setupAuth(OAuthInfo, esriId);

      // ---- Framing -----------------------------------------------------------
      // Fit the data box into the screen area left free by the HUD (title on top,
      // timeline at the bottom), computing centre and scale directly so the fit
      // does not depend on basemap zoom levels.
      let dataBox = null, camHome = null;
      async function fitView() {
        if (!dataBox) return;
        const w = view.width, h = view.height;
        const title = $("hud-title").getBoundingClientRect();
        const furn = $("hud-right").getBoundingClientRect();
        const tl = $("hud-timeline");
        const bottom = tl.offsetParent ? Math.min(h - tl.getBoundingClientRect().top + 16, h * 0.35) : 24;
        // Free rectangle: right of the title column, left of the north arrow / scale stack, above the scrubber
        let L = title.right + 24, Rr = (furn.width ? furn.left : w) - 24, T = 24;
        // Narrow tiles: the title column is too wide to sit beside, so reserve the space above the map instead
        if (Rr - L < w * 0.45) { L = 24; Rr = w - 24; T = Math.min(title.bottom + 12, h * 0.4); }
        const availW = Math.max(Rr - L, 50), availH = Math.max(h - T - bottom, 50);
        const bw = (dataBox.xmax - dataBox.xmin) * (1 + 2 * CFG.padding) || 1000;
        const bh = (dataBox.ymax - dataBox.ymin) * (1 + 2 * CFG.padding) || 1000;
        const res = Math.max(bw / availW, bh / availH);           // metres per pixel
        // Centre of the data goes to the centre of the free rectangle (screen y grows downwards)
        const sx = (L + Rr) / 2 - w / 2 + CFG.panX * availW, sy = (T + (h - bottom)) / 2 - h / 2;   // panX nudges the survey right
        const cx = (dataBox.xmin + dataBox.xmax) / 2 - sx * res;
        const cy = (dataBox.ymin + dataBox.ymax) / 2 + sy * res;
        // goTo silently ignores a plain-object point centre in SDK 5.x, so pass [lon, lat] (always honoured)
        const R = 6378137;
        const lon = (cx / R) * 180 / Math.PI;
        const lat = (2 * Math.atan(Math.exp(cy / R)) - Math.PI / 2) * 180 / Math.PI;
        await view.goTo({ center: [lon, lat], scale: res * 96 * 39.37 }, { animate: false });
        // Home view, used by the day-by-day camera (centre offset from the data centre = HUD shift)
        camHome = { cx, cy, res, availW, availH, dcx: (dataBox.xmin + dataBox.xmax) / 2, dcy: (dataBox.ymin + dataBox.ymax) / 2 };

        // Marker size from typical node spacing on screen, so a dense grid keeps its line texture
        SIZE.node = CFG.nodeSize; SIZE.flash = CFG.flashSize;
        if (CFG.autoSize && data) {
          const spacing = Math.sqrt(((dataBox.xmax - dataBox.xmin) * (dataBox.ymax - dataBox.ymin)) / data.rows.length); // metres
          SIZE.node = Math.min(CFG.nodeSize, Math.max(1.3, (spacing / res) * 0.5));
          SIZE.flash = Math.min(CFG.flashSize, Math.max(5, SIZE.node * 3.4));
        }
        if (ghostLayer) ghostLayer.renderer = ghostRenderer();
        lastT = NaN;                                   // force the animated renderer to rebuild
        updateFurniture();
      }

      // ---- North arrow + scale bar -------------------------------------------
      // Scale: ground metres per pixel at the map centre (Web Mercator stretches by 1/cos(latitude)),
      // rounded to a "nice" length (1, 2 or 5 x 10^n) that fits in about 170 px.
      function updateFurniture() {
        $("north").style.transform = `rotate(${view.rotation || 0}deg)`;   // rotation = clockwise angle of north
        // Ground metres per pixel, measured between two screen points 100 px apart at the view centre
        // (haversine on their lon/lat), so it is correct in any map projection.
        const a = view.toMap({ x: view.width / 2 - 50, y: view.height / 2 }), b = view.toMap({ x: view.width / 2 + 50, y: view.height / 2 });
        if (!a || !b || a.latitude == null || b.latitude == null) return;
        const rad = Math.PI / 180, dLat = (b.latitude - a.latitude) * rad, dLon = (b.longitude - a.longitude) * rad;
        const hv = Math.sin(dLat / 2) ** 2 + Math.cos(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.sin(dLon / 2) ** 2;
        const mpp = (2 * 6371008.8 * Math.asin(Math.sqrt(hv))) / 100;
        if (!mpp || !isFinite(mpp)) return;
        // Fixed length (scaleKm, default 5 km) unless that would be absurdly short or long on this screen
        let nice = CFG.scaleKm * 1000;
        if (!(nice > 0) || nice / mpp < 40 || nice / mpp > 320) {
          const target = mpp * 170;                       // fallback: a "nice" length about 170 px long
          const p10 = Math.pow(10, Math.floor(Math.log10(target)));
          nice = [5, 2, 1].map((k) => k * p10).find((v) => v <= target) || p10;
        }
        $("scalebar").querySelector(".bar").style.width = `${Math.round(nice / mpp)}px`;
        $("scale-lbl").textContent = nice >= 1000 ? `${nf.format(nice / 1000)} km` : `${nf.format(nice)} m`;
      }

      // ---- Data (re)loading --------------------------------------------------
      let data, mainLayer, ghostLayer, rippleLayer, lastFetch = 0, lastT = NaN, curT = -1;

      // ---- Phone mode: paint the nodes on a canvas ------------------------------
      // Same look as the map layer (white-hot -> yellow -> lime -> green by age), drawn from
      // typed arrays with no per-node objects. Rows are sorted by time, so the first k rows
      // are the deployed ones and the oldest run is one flat colour batch.
      const lerp = (a, b, f) => a + (b - a) * f;
      function ageColour(a) {                                   // a = days since deployment
        const stops = [[0, RAMP.hot], [0.25, RAMP.warm], [1, RAMP.cool], [3, RAMP.rest]];
        for (let i = 1; i < stops.length; i++) {
          if (a <= stops[i][0]) {
            const [a0, c0] = stops[i - 1], [a1, c1] = stops[i], f = (a - a0) / (a1 - a0);
            return `rgba(${lerp(c0[0], c1[0], f) | 0},${lerp(c0[1], c1[1], f) | 0},${lerp(c0[2], c1[2], f) | 0},${lerp(c0[3], c1[3], f).toFixed(2)})`;
          }
        }
        return `rgba(${RAMP.rest[0]},${RAMP.rest[1]},${RAMP.rest[2]},${RAMP.rest[3]})`;
      }
      function drawNodesCanvas(T) {
        if (!data?.nx || !view.extent) return;
        const cv = $("nodes-canvas"), dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap at 2x to save memory
        const w = view.width, h = view.height;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
        const ctx = cv.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        if (T < 0) return;
        const ext = view.extent, res = view.resolution, x0 = ext.xmin, y1 = ext.ymax;
        const k = countUpTo(data.tSorted, T);                       // deployed so far
        const kRest = countUpTo(data.tSorted, T - 3);                // settled (3+ days old)
        const s = Math.max(SIZE.node * 0.9, 1.2), half = s / 2;
        // 1. Settled nodes: one colour, one batch
        ctx.fillStyle = `rgb(${RAMP.rest[0]},${RAMP.rest[1]},${RAMP.rest[2]})`;
        ctx.globalAlpha = RAMP.rest[3];
        ctx.beginPath();
        for (let i = 0; i < kRest; i++) {
          const px = (data.nx[i] - x0) / res, py = (y1 - data.ny[i]) / res;
          if (px < -4 || py < -4 || px > w + 4 || py > h + 4) continue;   // off screen
          ctx.rect(px - half, py - half, s, s);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
        // 2. Recent nodes: colour and size by age, newest last (on top), soft glow on the freshest
        for (let i = kRest; i < k; i++) {
          const a = T - data.tSorted[i];
          const px = (data.nx[i] - x0) / res, py = (y1 - data.ny[i]) / res;
          if (px < -10 || py < -10 || px > w + 10 || py > h + 10) continue;
          const size = a < 0.3 ? lerp(SIZE.flash, SIZE.node * 1.5, a / 0.3) : a < 1.5 ? lerp(SIZE.node * 1.5, SIZE.node, (a - 0.3) / 1.2) : SIZE.node;
          ctx.fillStyle = ageColour(a);
          if (a < 0.25) { ctx.shadowColor = "rgba(255,214,64,0.9)"; ctx.shadowBlur = size * 1.2; } else ctx.shadowBlur = 0;
          ctx.beginPath(); ctx.arc(px, py, size / 2, 0, 6.2832); ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
      // Metadata as key/value pairs, laid out in two columns so the box stays short
      let metaRows = [];
      const esc = (v) => String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      function renderMeta() {
        $("debug").style.display = "grid";
        $("debug").innerHTML = metaRows.map(([k, v]) => `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`).join("");
      }
      // Faint full footprint drawn under the animation
      const ghostRenderer = () => ({ type: "simple", symbol: { type: "simple-marker", size: Math.max(1, SIZE.node * 0.6), color: [180, 200, 225, 0.08], outline: null } });
      async function loadData() {
        overlay("Loading deployment data…", { spin: true });
        const raw = CFG.demo ? demoFeatures() : await fetchFeatures(FeatureLayer);
        if (!raw.rows.length) { overlay("No deployments recorded yet. This view will fill in as the crews deploy."); return false; }
        data = prepare(raw);
        data.clusters = dayClusters(data.rows, data.firstDay, data.nDays);   // where each day "pings"
        data.dayBox = dayBoxes(data.rows, data.firstDay, data.nDays);       // where each day's work is, for the camera
        // Camera centre per day: that day's work area; idle days keep the previous one
        const firstWork = data.dayBox.find(Boolean);
        let carry = firstWork ? [firstWork.cx, firstWork.cy] : null;
        data.panCentre = data.dayBox.map((b) => (carry = b ? [b.cx, b.cy] : carry));
        lastFetch = Date.now();

        // Replace layers with fresh ones built from the new data
        map.removeMany([ghostLayer, mainLayer].filter(Boolean));
        if (LITE) {
          // Phone mode: no map layer at all. Positions and times live in plain typed arrays
          // (a few hundred KB) and are painted onto one canvas each frame, which iOS Safari handles easily.
          ghostLayer = mainLayer = null;
          data.nx = Float64Array.from(data.rows, (r) => r.x);
          data.ny = Float64Array.from(data.rows, (r) => r.y);
          $("nodes-canvas").style.display = "block";
        } else {
          ghostLayer = CFG.ghost ? makeLayer(FeatureLayer, Graphic, data, { renderer: ghostRenderer() }) : null;
          mainLayer = makeLayer(FeatureLayer, Graphic, data, {
            renderer: rendererAt(-1),
            effect: "bloom(1.5, 0.7px, 0.8)"          // glow on bright pixels only (threshold keeps settled nodes crisp)
          });
          map.addMany([ghostLayer, mainLayer].filter(Boolean));
        }
        // Ripples always draw on top of the nodes
        if (!rippleLayer) rippleLayer = new GraphicsLayer({ ...(LITE ? {} : { effect: "bloom(0.8, 0.4px, 0.2)" }), listMode: "hide" });
        map.remove(rippleLayer); map.add(rippleLayer);

        // Survey outline (read live, like the nodes); failures fall back to framing on the nodes
        await loadOutline(raw);

        // Frame the survey between the HUD blocks (see fitView): the whole outline when we have one,
        // otherwise the deployed nodes (ignoring the outermost 0.2% so a stray fix cannot zoom out the map)
        if (CFG.outlineFrame && outline.box) dataBox = { ...outline.box };
        else {
          const xs = Float64Array.from(data.rows, (r) => r.x).sort(), ys = Float64Array.from(data.rows, (r) => r.y).sort();
          const q = (a, f) => a[Math.min(a.length - 1, Math.max(0, Math.round(f * (a.length - 1))))];
          dataBox = { xmin: q(xs, 0.002), xmax: q(xs, 0.998), ymin: q(ys, 0.002), ymax: q(ys, 0.998) };
        }
        await view.when();
        await fitView();

        // First / last day (used by the debug panel)
        const d0 = new Date(data.firstDay * 864e5), d1 = new Date(data.lastDay * 864e5);

        if (CFG.debug) {                               // metadata block, shown by default
          metaRows = [["source", raw.meta.source], ["records", nf.format(data.rows.length)], ["date field", raw.meta.dateField],
            ["day basis", raw.meta.zone], ["first", dateFmt.format(d0)], ["last", dateFmt.format(d1)],
            ["days", data.nDays], ["fetched", timeFmt.format(new Date())]];
          if (outline.status) metaRows.push(["outline", outline.status]);
          if (raw.meta.filter) metaRows.push(["filter", raw.meta.filter]);
          if (LITE) metaRows.push(["mode", "phone (lite)"]);
          renderMeta();
        }
        hideOverlay();
        fitHud();                                      // after the metadata is filled in
        if (CFG.outlineFrame && outline.box) await fitView();   // re-frame if the left column changed size
        return true;
      }

      // ---- Survey outline: thin glowing boundary that traces itself each loop ----
      // Rings are kept as arrays of [x, y] (Web Mercator). drawOutline(f) shows the first
      // fraction f of the total perimeter, so the boundary is "drawn" like a pen at loop start.
      // Outline colour (default purple, matching the project map); override with ?outlineColor=RRGGBB
      const OUTLINE_RGB = /^#?[0-9a-f]{6}$/i.test(CFG.outlineColor || "")
        ? [0, 2, 4].map((i) => parseInt(CFG.outlineColor.replace("#", "").slice(i, i + 2), 16)) : [176, 64, 255];
      let outline = { rings: [], box: null, total: 0, status: "" }, outlineLayer = null, outlineGlow = null, outlineLine = null, lastOutlineF = -1;
      async function loadOutline(raw) {
        outline = { rings: [], box: null, total: 0, status: "" };
        try {
          if (raw.outline) outline.rings = raw.outline;                          // demo
          else if (CFG.outlineUrl) {
            const layer = new FeatureLayer({ url: CFG.outlineUrl, outFields: [] });
            const fs = await layer.queryFeatures({ where: "1=1", returnGeometry: true, outSpatialReference: { wkid: 102100 } });
            for (const g of fs.features) {
              const geom = g.geometry; if (!geom) continue;
              // Polygons: close each ring; polylines: use paths as they are
              for (const r of geom.rings || geom.paths || []) {
                const ring = r.map((p) => [p[0], p[1]]);
                if (geom.rings && (ring[0][0] !== ring.at(-1)[0] || ring[0][1] !== ring.at(-1)[1])) ring.push([...ring[0]]);
                outline.rings.push(ring);
              }
            }
          } else return;
          if (!outline.rings.length) { outline.status = "no geometry"; return; }
          // Extent and total perimeter (for the tracing animation)
          let [xmin, xmax, ymin, ymax] = [Infinity, -Infinity, Infinity, -Infinity];
          for (const r of outline.rings) {
            r.cum = [0];
            for (let i = 0; i < r.length; i++) {
              const [x, y] = r[i];
              xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
              if (i) r.cum.push(r.cum[i - 1] + Math.hypot(x - r[i - 1][0], y - r[i - 1][1]));
            }
            outline.total += r.cum.at(-1);
          }
          outline.box = { xmin, xmax, ymin, ymax };
          outline.status = `${outline.rings.length} ring${outline.rings.length > 1 ? "s" : ""}`;
          // Two lines: a soft wide glow under a crisp thin line
          if (!outlineLayer) {
            outlineLayer = new GraphicsLayer({ listMode: "hide" });
            outlineGlow = new Graphic({ symbol: { type: "simple-line", color: [...OUTLINE_RGB, 0.28], width: 6, cap: "round", join: "round" } });   // soft purple halo
            outlineLine = new Graphic({ symbol: { type: "simple-line", color: [...OUTLINE_RGB, 1], width: 1.8, cap: "round", join: "round" } });     // crisp purple line
            outlineLayer.addMany([outlineGlow, outlineLine]);
          }
          map.remove(outlineLayer); map.add(outlineLayer, 0);                     // under the nodes, above the basemap
          lastOutlineF = -1; drawOutline(1);
        } catch (e) {
          console.warn("Outline unavailable:", e);
          outline.status = `unavailable (${String(e.message || e).slice(0, 30)})`;
        }
      }
      function drawOutline(f) {
        if (!outlineLayer || !outline.total) return;
        f = Math.min(Math.max(f, 0), 1);
        if (Math.abs(f - lastOutlineF) < 0.002) return;                            // nothing visible changed
        lastOutlineF = f;
        let budget = f * outline.total;                                           // perimeter length still to draw
        const paths = [];
        for (const r of outline.rings) {
          if (budget <= 0) break;
          const len = r.cum.at(-1);
          if (budget >= len) { paths.push(r); budget -= len; continue; }
          // Partial ring: whole segments, then the cut segment up to the pen tip
          const path = [r[0]];
          for (let i = 1; i < r.length; i++) {
            if (r.cum[i] <= budget) { path.push(r[i]); continue; }
            const t = (budget - r.cum[i - 1]) / (r.cum[i] - r.cum[i - 1]);
            path.push([r[i - 1][0] + (r[i][0] - r[i - 1][0]) * t, r[i - 1][1] + (r[i][1] - r[i - 1][1]) * t]);
            break;
          }
          if (path.length > 1) paths.push(path);
          budget = 0;
        }
        const geom = paths.length ? { type: "polyline", paths, spatialReference: { wkid: 102100 } } : null;
        outlineGlow.geometry = geom; outlineLine.geometry = geom;
      }

      // ---- Progress gauge: deployed so far vs the planned total ---------------
      const G_CIRC = 2 * Math.PI * 42;                   // circumference of the arc circle
      if (CFG.target > 0) $("g-lbl").textContent = `of ${nf.format(CFG.target)} planned`;
      else $("stat-gauge").style.display = "none";
      function updateGauge(k) {
        if (!(CFG.target > 0)) return;
        const f = Math.min(k / CFG.target, 1);           // fraction complete (capped at 100%)
        $("g-arc").setAttribute("stroke-dasharray", `${(f * G_CIRC).toFixed(2)} ${G_CIRC.toFixed(2)}`);
        $("g-arc").style.opacity = f > 0 ? 1 : 0;        // round line caps would show a dot at 0%
        // Glowing tip at the end of the arc (svg is rotated -90deg, so angle 0 = 12 o'clock)
        const a = f * 2 * Math.PI;
        $("g-head").setAttribute("cx", (50 + 42 * Math.cos(a)).toFixed(2));
        $("g-head").setAttribute("cy", (50 + 42 * Math.sin(a)).toFixed(2));
        $("g-pct").textContent = (f * 100).toFixed(f < 0.1 ? 1 : 0);
      }

      // ---- Animation loop ----------------------------------------------------
      // Phases: hold empty -> play 0..nDays -> hold full -> (refresh) -> repeat
      let phaseStart = performance.now(), phase = "holdStart", paused = false, pauseAt = 0, lastDraw = 0;
      const panCam = () => CFG.camera === "pan" && !reducedMotion();
      const playSeconds = () => panCam()
        ? Math.min(CFG.camMaxDuration, Math.max(CFG.minDuration, data.nDays * CFG.camSecondsPerDay))
        : Math.min(CFG.maxDuration, Math.max(CFG.minDuration, data.nDays * CFG.secondsPerDay));

      // ---- Pan camera: one fixed zoom, gliding from day to day ------------------
      // The zoom never changes during playback. At the start of each day the camera glides
      // (first 40% of the day, eased) from yesterday's work area to today's, then holds.
      // camBlend eases between the whole-survey view (0) and the pan view (1): it rises once
      // at the start of each loop (after the outline has drawn) and falls once at the end,
      // so the finished survey is always shown whole.
      let camLast = "", camBlend = 0;
      const smooth = (x) => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
      function panCentre(T) {
        const c = data.panCentre, d = Math.min(Math.max(Math.floor(T), 0), data.nDays - 1);
        if (T < 0) return c[0];
        const prev = c[Math.max(d - 1, 0)], cur = c[d], e = smooth((T - d) / 0.4);
        return [prev[0] + (cur[0] - prev[0]) * e, prev[1] + (cur[1] - prev[1]) * e];
      }
      function updateCamera(T) {
        if (!camHome || !panCam() || !data.panCentre) return;
        const res0 = camHome.res, res1 = camHome.res / CFG.panZoom;
        const res = res0 * Math.pow(res1 / res0, camBlend);                       // log-even zoom blend
        // Pan target, clamped so the view never drifts past the survey's edges
        let [px, py] = panCentre(T);
        const hw = (camHome.availW * res1) / 2, hh = (camHome.availH * res1) / 2;
        const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(Math.max(v, lo), hi));
        px = clamp(px, dataBox.xmin + hw * 0.6, dataBox.xmax - hw * 0.6);
        py = clamp(py, dataBox.ymin + hh * 0.6, dataBox.ymax - hh * 0.6);
        let cx = camHome.dcx + (px - camHome.dcx) * camBlend;
        let cy = camHome.dcy + (py - camHome.dcy) * camBlend;
